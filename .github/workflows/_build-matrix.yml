name: Build Matrix

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string

jobs:
  linux-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglfw3-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev libxfixes-dev \
            libwayland-dev libxkbcommon-dev
      - name: Scaffold templateApp (consumer)
        run: chmod +x create.sh && ./create.sh templateApp
      - name: Build all targets via build.sh
        run: chmod +x build.sh && ./build.sh ${{ inputs.build_type }} static demo
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: linux-desktop
          path: |
            _build/${{ inputs.build_type }}/engine/libApEngine.a
            _build/${{ inputs.build_type }}/examples/demo/demo
            _build/${{ inputs.build_type }}/examples/demo/assets/
            _build/${{ inputs.build_type }}/apps/templateApp/templateApp
            _build/${{ inputs.build_type }}/apps/templateApp/assets/
          retention-days: 1

  linux-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 4.0.15
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglfw3-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev libxfixes-dev \
            libwayland-dev libxkbcommon-dev
      - name: Scaffold templateApp (consumer)
        run: chmod +x create.sh && ./create.sh templateApp
      - name: Build all targets via build.sh (web)
        run: chmod +x build.sh && ./build.sh ${{ inputs.build_type }} web static demo
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: linux-web
          path: |
            _build/Web/engine/libApEngine.a
            _build/Web/examples/demo/demo.html
            _build/Web/examples/demo/demo.js
            _build/Web/examples/demo/demo.wasm
            _build/Web/examples/demo/demo.data
            _build/Web/apps/templateApp/templateApp.html
            _build/Web/apps/templateApp/templateApp.js
            _build/Web/apps/templateApp/templateApp.wasm
            _build/Web/apps/templateApp/templateApp.data
          retention-days: 1

  windows-mingw:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          cache: false
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
      - name: Scaffold templateApp (consumer)
        run: create.bat templateApp
        shell: cmd
      - name: Build all targets via build.bat (mingw)
        run: ./build.bat ${{ inputs.build_type }} static demo
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-mingw
          path: |
            _build/${{ inputs.build_type }}/engine/libApEngine.a
            _build/${{ inputs.build_type }}/examples/demo/demo.exe
            _build/${{ inputs.build_type }}/examples/demo/assets/
            _build/${{ inputs.build_type }}/apps/templateApp/templateApp.exe
            _build/${{ inputs.build_type }}/apps/templateApp/assets/
          retention-days: 1

  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Scaffold templateApp (consumer)
        run: .\create.bat templateApp
        shell: cmd
      - name: Build all targets via build.bat (msvc)
        run: .\build.bat msvc ${{ inputs.build_type }} static demo
        shell: cmd
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-msvc
          path: |
            _build/msvc-${{ inputs.build_type }}/engine/${{ inputs.build_type }}/ApEngine.lib
            _build/msvc-${{ inputs.build_type }}/examples/demo/${{ inputs.build_type }}/demo.exe
            _build/msvc-${{ inputs.build_type }}/examples/demo/${{ inputs.build_type }}/assets/
            _build/msvc-${{ inputs.build_type }}/apps/templateApp/${{ inputs.build_type }}/templateApp.exe
            _build/msvc-${{ inputs.build_type }}/apps/templateApp/${{ inputs.build_type }}/assets/
          retention-days: 1
