name: Build Matrix

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string

jobs:
  linux-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglfw3-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev libxfixes-dev \
            libwayland-dev libxkbcommon-dev
      - run: chmod +x build.sh && ./build.sh ${{ inputs.build_type }}
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: linux-desktop
          path: |
            _build/${{ inputs.build_type }}/app/app
            _build/${{ inputs.build_type }}/app/assets/
          retention-days: 1

  linux-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 4.0.15
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglfw3-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev libxfixes-dev \
            libwayland-dev libxkbcommon-dev
      - run: chmod +x build.sh && ./build.sh ${{ inputs.build_type }} web
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: linux-web
          path: |
            _build/Web/app/app.html
            _build/Web/app/app.js
            _build/Web/app/app.wasm
            _build/Web/app/app.data
          retention-days: 1

  windows-mingw:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          cache: false
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
      - run: ./build.bat ${{ inputs.build_type }} static
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-mingw
          path: |
            _build/${{ inputs.build_type }}/app/app.exe
            _build/${{ inputs.build_type }}/app/assets/
          retention-days: 1

  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: ./build.bat msvc ${{ inputs.build_type }} static
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-msvc
          path: |
            _build/msvc-${{ inputs.build_type }}/app/${{ inputs.build_type }}/app.exe
            _build/msvc-${{ inputs.build_type }}/app/${{ inputs.build_type }}/assets/
          retention-days: 1
