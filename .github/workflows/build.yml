name: Build

permissions:
  contents: write

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  matrix:
    uses: ./.github/workflows/_build-matrix.yml
    with:
      build_type: Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-desktop
          path: release/linux-desktop
      - uses: actions/download-artifact@v4
        with:
          name: linux-web
          path: release/linux-web
      - uses: actions/download-artifact@v4
        with:
          name: windows-mingw
          path: release/windows-mingw
      - uses: actions/download-artifact@v4
        with:
          name: windows-msvc
          path: release/windows-msvc
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Automated release with built executables."
          files: |
            release/linux-desktop/app
            release/linux-web/app.html
            release/linux-web/app.js
            release/linux-web/app.wasm
            release/linux-web/app.data
            release/windows-mingw/app.exe
            release/windows-msvc/app.exe
          draft: false
          prerelease: false
