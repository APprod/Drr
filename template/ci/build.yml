name: Build

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  matrix:
    uses: ./.github/workflows/_build-matrix.yml
    with:
      build_type: Release

  release:
    needs: [matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-desktop
          path: release/linux-desktop
      - uses: actions/download-artifact@v4
        with:
          name: linux-web
          path: release/linux-web
      - uses: actions/download-artifact@v4
        with:
          name: windows-mingw
          path: release/windows-mingw
      - uses: actions/download-artifact@v4
        with:
          name: windows-msvc
          path: release/windows-msvc

      - name: Package linux-desktop (apps)
        run: |
          cd release/linux-desktop
          zip -r ../../linux-desktop.zip .
          cd -

      - name: Package linux-web (apps)
        run: |
          cd release/linux-web
          zip -r ../../linux-web.zip .
          cd -

      - name: Package windows-mingw (apps)
        run: |
          cd release/windows-mingw
          zip -r ../../windows-mingw.zip .
          cd -

      - name: Package windows-msvc (apps)
        run: |
          cd release/windows-msvc
          zip -r ../../windows-msvc.zip .
          cd -

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Automated release with apps per platform (manual trigger)."
          files: |
            linux-desktop.zip
            linux-web.zip
            windows-mingw.zip
            windows-msvc.zip
          draft: false
          prerelease: false
